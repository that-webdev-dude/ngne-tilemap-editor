name: Runtime latest

# The generated runtime against the newest published @ngne/core (SPEC §11.4): weekly and on
# demand, report-only. It is not part of the CI workflow, so its failure fails no required
# run; a failure means a new NGNE release broke the engine contract (ENGINE §7).
on:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    latest:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run compat -- latest
